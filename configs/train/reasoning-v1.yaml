# Production continuation: 8 nodes x 8 GCDs, one packed 16K sequence per rank.
model_name_or_path: /scratch/project_465002530/users/bmoell/oellm-reasoning-training/artifacts/models/oellm-9b-256k-sft
dtype: bfloat16
attn_implementation: flash_attention_2
datasets:
  - path: parquet
    data_files:
      train: /scratch/project_465002530/users/bmoell/oellm-reasoning-training/artifacts/data/reasoning-v1/train.parquet
    split: train
output_dir: /scratch/project_465002530/users/bmoell/oellm-reasoning-training/artifacts/checkpoints/reasoning-v1
eos_token: <end_of_turn>
max_length: 16384
packing: true
assistant_only_loss: true
use_liger_kernel: true
liger_kernel_config:
  rope: false
  cross_entropy: false
  fused_linear_cross_entropy: true
  rms_norm: false
  swiglu: false
dataset_num_proc: 6
ddp_timeout: 18000
max_steps: 2000
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 3.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
logging_steps: 10
save_steps: 250
save_total_limit: 2
save_only_model: false
eval_strategy: "no"
report_to: none
