version: reasoning-anneal300b-dolci-translated-v2
description: Anneal-300B reasoning continuation with 12-language translated Dolci Think supervision.
seed: 20260924
target_tokens: 524288000
token_share_tolerance: 0.0025
min_tokens_per_example: 64
max_tokens_per_example: 16384
deduplication: language_scoped_normalized_user_prompt_sha256

# The pilot establishes broad coverage. Translated Dolci is then selected before
# other weighted sources so its 12 language quotas cannot be displaced by replay.
selection_order:
  - reasoning-traces-multilingual-v0.2-pilot
  - dolci-think-translated-cs
  - dolci-think-translated-de
  - dolci-think-translated-el
  - dolci-think-translated-es
  - dolci-think-translated-fi
  - dolci-think-translated-fr
  - dolci-think-translated-it
  - dolci-think-translated-nl
  - dolci-think-translated-pl
  - dolci-think-translated-ro
  - dolci-think-translated-sv
  - dolci-think-translated-uk
  - nemotron-v2-de-decontaminated
  - nemotron-v2-fr-decontaminated
  - nemotron-v2-es-decontaminated
  - nemotron-v2-it-decontaminated
  - openr1-math-220k-verified
  - dolci-think-32b-decontaminated
  - dolci-think-7b-decontaminated
  - dolci-instruct-sft-replay

model:
  repo_id: Neonkraft/oellm-9b-256k-theta64m-prelude-anneal300b-instruct-sft
  revision: 85bf18fb4f0bee6ac6270f06b1d1c6b3be200f31
  local_name: oellm-9b-256k-anneal300b-instruct-sft
  chat_template: templates/oellm_qwen3_assistant_mask.jinja
  special_token_ids:
    turn_start: 3
    turn_end: 4
    think_end: 17
    think_start: 18
    pad: 262144
  expected:
    architecture: Qwen3ForCausalLM
    model_type: qwen3
    max_position_embeddings: 262144
    rope_theta: 64000000
    vocab_size: 263168
    eos_token: <eos>
    pad_token: <pad>
    turn_end_token: <|im_end|>

translated_dolci_defaults: &translated_dolci_defaults
  role: multilingual_reasoning
  selection: token_weighted
  token_share: 0.02
  adapter: messages
  require_reasoning_trace: true
  reasoning_format: think_and_answer
  reject_strict_repetition: true
  license: Apache-2.0

translated_dolci_input: &translated_dolci_input
  kind: huggingface_snapshot
  repo_id: openeurollm/Dolci-Think-SFT-translated
  revision: ba4754ab30afb66e652c3690ef0390dcea4939cd
  split: train

sources:
  - id: reasoning-traces-multilingual-v0.2-pilot
    role: multilingual_math_coverage
    selection: all_once
    language: from_row
    language_field: language
    adapter: accepted_messages
    require_reasoning_trace: true
    reasoning_format: think_and_answer
    reject_strict_repetition: true
    expected_selected_rows: 3351
    expected_languages: 37
    input:
      kind: huggingface_snapshot
      repo_id: openeurollm/reasoning-traces-multilingual
      revision: 031163d3a8876682a395cc65abf924b1edc2fcd9
      split: train
      files: data/train-*.parquet
      expected_rows: 3425
    license: CC-BY-4.0

  - <<: *translated_dolci_defaults
    id: dolci-think-translated-cs
    language: cs
    input:
      <<: *translated_dolci_input
      files: cs/*.parquet
      expected_rows: 74999
  - <<: *translated_dolci_defaults
    id: dolci-think-translated-de
